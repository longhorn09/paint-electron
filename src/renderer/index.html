<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/icons.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Header Toolbar -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand">
          <div class="brand-icon">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
          </div>
          <span>Paint</span>
        </div>

        <!-- File Actions -->
        <div class="toolbar-group">
          <button id="btn-file-new" class="btn-icon" title="New Image (Ctrl+N)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
            <span>New</span>
          </button>
          <button id="btn-file-open" class="btn-icon" title="Open Image (Ctrl+O)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            <span>Open</span>
          </button>
          <button id="btn-file-save" class="btn-icon" title="Save Image (Lossless PNG / Format) (Ctrl+S)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            <span>Save</span>
          </button>
          <button id="btn-file-save-as" class="btn-icon" title="Save As (PNG, JPG, WebP, GIF) (Ctrl+Shift+S)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
            <span>Save As</span>
          </button>
        </div>

        <div class="divider"></div>

        <!-- History Actions -->
        <div class="toolbar-group">
          <button id="btn-undo" class="btn-icon" disabled title="Undo (Ctrl+Z)">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
          </button>
          <button id="btn-redo" class="btn-icon" disabled title="Redo (Ctrl+Y)">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
          </button>
        </div>
      </div>

      <!-- Center Transform Controls -->
      <div class="header-center">
        <!-- Rotate & Flip -->
        <div class="toolbar-group">
          <button id="btn-rotate-ccw" class="btn-icon" title="Rotate 90° CCW (Ctrl+Shift+R)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
            <span>90° CCW</span>
          </button>
          <button id="btn-rotate-cw" class="btn-icon" title="Rotate 90° CW (Ctrl+R)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><polyline points="21 3 21 8 16 8"></polyline></svg>
            <span>90° CW</span>
          </button>
          <button id="btn-rotate-180" class="btn-icon" title="Rotate 180°">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            <span>180°</span>
          </button>
          <button id="btn-flip-h" class="btn-icon" title="Flip Horizontal">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="16 3 21 8 16 13"></polyline><line x1="21" y1="8" x2="9" y2="8"></line><polyline points="8 21 3 16 8 11"></polyline><line x1="3" y1="16" x2="15" y2="16"></line></svg>
            <span>Flip H</span>
          </button>
          <button id="btn-flip-v" class="btn-icon" title="Flip Vertical">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="3 8 8 3 13 8"></polyline><line x1="8" y1="3" x2="8" y2="15"></line><polyline points="21 16 16 21 11 16"></polyline><line x1="16" y1="21" x2="16" y2="9"></line></svg>
            <span>Flip V</span>
          </button>
        </div>

        <div class="divider"></div>

        <!-- Image Resize & Blur Actions -->
        <div class="toolbar-group">
          <button id="btn-open-resize" class="btn-icon" title="Resize Image (Ctrl+Alt+I)">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
            <span>Resize</span>
          </button>
          <button id="btn-open-blur" class="btn-icon" data-tool="blur" title="Gaussian Blur (B)">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6" stroke-dasharray="2 2"></circle><circle cx="12" cy="12" r="2"></circle></svg>
            <span>Gaussian Blur</span>
          </button>
        </div>
      </div>

      <div class="header-right">
        <!-- Fit / 100% Quick View -->
        <div class="toolbar-group">
          <button id="btn-zoom-fit" class="btn-icon" title="Fit to Window (Ctrl+0)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
            <span>Fit</span>
          </button>
          <button id="btn-zoom-100" class="btn-icon" title="Actual Size 100% (Ctrl+1)">
            <span>100%</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Contextual Tool Options Bar -->
    <div id="tool-options-container">
      <!-- 1. Selection Tool Options -->
      <div id="selection-options-bar" class="tool-options-bar">
        <div class="options-group">
          <span class="options-label">Selection Size (px):</span>
          <span class="options-label">W:</span>
          <input type="number" id="sel-width-input" class="input-num" min="1" placeholder="W">
          <span class="options-label">H:</span>
          <input type="number" id="sel-height-input" class="input-num" min="1" placeholder="H">
          <span class="options-label" style="margin-left: 6px;">Pos:</span>
          <span class="options-label">X:</span>
          <input type="number" id="sel-x-input" class="input-num" min="0" placeholder="X">
          <span class="options-label">Y:</span>
          <input type="number" id="sel-y-input" class="input-num" min="0" placeholder="Y">
          <button id="btn-set-sel-size" class="btn-icon btn-accent" title="Apply exact pixel size">Set Size</button>
        </div>

        <div class="divider"></div>

        <div class="options-group">
          <button id="btn-crop-sel" class="btn-icon btn-success" disabled title="Crop image to selection (Enter)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"></path><path d="M18 22V8a2 2 0 0 0-2-2H2"></path></svg>
            <span>Crop to Selection</span>
          </button>
          <button id="btn-clear-sel" class="btn-icon" disabled title="Clear selected pixels (Delete)">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            <span>Clear</span>
          </button>
          <button id="btn-copy-sel" class="btn-icon" disabled title="Copy selection (Ctrl+C)">
            <svg class="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <span>Copy</span>
          </button>
          <button id="btn-cut-sel" class="btn-icon" disabled title="Cut selection (Ctrl+X)">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>
            <span>Cut</span>
          </button>
        </div>

        <div class="divider"></div>

        <div class="options-group">
          <button id="btn-select-all" class="btn-icon" title="Select All (Ctrl+A)">Select All</button>
          <button id="btn-deselect" class="btn-icon" disabled title="Deselect (Ctrl+D / Esc)">Deselect</button>
        </div>
      </div>

      <!-- 2. Fill Tool Options -->
      <div id="fill-options-bar" class="tool-options-bar" style="display: none;">
        <div class="options-group">
          <span class="options-label">Fill Color:</span>
          <input type="text" id="primary-color-hex" class="input-text" value="#3B82F6">
        </div>

        <div class="divider"></div>

        <div class="options-group">
          <span class="options-label">Tolerance:</span>
          <input type="range" id="fill-tolerance-slider" class="input-range" min="0" max="100" value="20" style="width: 100px;">
          <span id="fill-tolerance-value" class="options-label" style="min-width: 35px;">20%</span>
        </div>

        <div class="divider"></div>

        <div class="options-group">
          <span class="options-label">Palette:</span>
          <div id="recent-colors-palette" class="recent-colors"></div>
        </div>
      </div>
    </div>

    <!-- Main Workspace (Tools Palette + Viewport) -->
    <div class="main-workspace">
      <!-- Side Tool Palette -->
      <aside class="side-tool-palette">
        <!-- 1. Selection Tool -->
        <button class="palette-btn active" data-tool="select" title="Rectangle Selection (S / M)">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 3"></rect></svg>
        </button>

        <!-- 2. Gaussian Blur Tool -->
        <button class="palette-btn" data-tool="blur" title="Gaussian Blur (B)">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6" stroke-dasharray="2 2"></circle><circle cx="12" cy="12" r="2"></circle></svg>
        </button>

        <!-- 3. Eyedropper Color Picker -->
        <button class="palette-btn" data-tool="picker" title="Color Picker / Eyedropper (I)">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
        </button>

        <!-- 4. Flood Fill Tool -->
        <button class="palette-btn" data-tool="fill" title="Fill Tool / Paint Bucket (G / F)">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19 11l-8-8-8.5 8.5a2.12 2.12 0 0 0 0 3l5 5a2.12 2.12 0 0 0 3 0L19 11z"></path><path d="M5 2l5 5"></path><path d="M2 13h15"></path><path d="M22 20a2 2 0 1 1-4 0c0-1.6 2-4 2-4s2 2.4 2 4z"></path></svg>
        </button>

        <div class="palette-divider"></div>

        <!-- Color Swatch Box -->
        <div class="color-indicator-container">
          <div class="color-preview-box" id="primary-color-box" title="Click to choose color">
            <input type="color" id="primary-color-input" value="#3b82f6">
          </div>
        </div>
      </aside>

      <!-- Viewport -->
      <main id="canvas-container" class="canvas-viewport-container">
        <!-- Floating Gaussian Blur Adjustment Bar (shown during blur mode) -->
        <div id="blur-adjust-bar" class="floating-bar" style="display: none;">
          <span class="options-label">Gaussian Blur Radius:</span>
          <input type="range" id="blur-radius-slider" class="input-range" min="0" max="100" value="12" style="width: 160px;">
          <span id="blur-radius-value" class="options-label" style="font-weight: 700; min-width: 45px; color: #38bdf8;">12 px</span>
          <button id="btn-blur-apply" class="btn-icon btn-success" title="Apply Blur (Enter)">Apply</button>
          <button id="btn-blur-cancel" class="btn-icon btn-danger" title="Cancel (Esc)">Cancel</button>
        </div>
      </main>
    </div>

    <!-- Status Bar -->
    <footer class="app-statusbar">
      <div class="status-left">
        <div class="status-item">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg>
          <span id="status-dimensions">800 × 600 px</span>
        </div>
        <div class="status-item">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 3"></rect></svg>
          <span id="status-selection">No selection</span>
        </div>
      </div>

      <div class="status-center">
        <div class="status-item">
          <span>Cursor:</span>
          <span id="status-cursor" style="font-family: monospace;">—</span>
        </div>
        <div class="status-item">
          <span>Pixel:</span>
          <div id="status-color-preview" class="status-color-swatch" style="background-color: transparent;"></div>
        </div>
      </div>

      <div class="status-right">
        <div class="zoom-controls">
          <button id="btn-zoom-out" class="btn-zoom" title="Zoom Out (Ctrl -)">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
          </button>
          <input type="range" id="zoom-slider" class="input-range" min="0.1" max="10.0" step="0.05" value="1.0" style="width: 80px;">
          <button id="btn-zoom-in" class="btn-zoom" title="Zoom In (Ctrl +)">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
          </button>
          <span id="status-zoom" style="font-family: monospace; min-width: 40px; text-align: right;">100%</span>
        </div>
      </div>
    </footer>
  </div>

  <!-- Resize Image Modal -->
  <div id="resize-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title">Resize Image</div>
      </div>
      <div class="modal-body">
        <div style="font-size: 12px; color: var(--text-muted);" id="resize-current-info">Current: 800 × 600 px</div>

        <div class="form-row">
          <span class="form-label">Dimensions (px):</span>
          <div class="dimension-inputs">
            <input type="number" id="resize-w-input" class="input-num" style="width: 80px;" min="1">
            <button id="resize-lock-ratio" class="lock-aspect-btn locked" title="Aspect ratio locked">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </button>
            <input type="number" id="resize-h-input" class="input-num" style="width: 80px;" min="1">
          </div>
        </div>

        <div class="form-row">
          <span class="form-label">Scale (%):</span>
          <div class="dimension-inputs">
            <input type="number" id="resize-w-pct" class="input-num" style="width: 80px;" min="1" value="100">
            <span style="color: var(--text-dim); width: 28px; text-align: center;">%</span>
            <input type="number" id="resize-h-pct" class="input-num" style="width: 80px;" min="1" value="100">
          </div>
        </div>

        <div class="form-row">
          <span class="form-label">Presets:</span>
          <div class="preset-chips">
            <button class="chip-btn" data-resize-preset="50%">50%</button>
            <button class="chip-btn" data-resize-preset="75%">75%</button>
            <button class="chip-btn" data-resize-preset="150%">150%</button>
            <button class="chip-btn" data-resize-preset="200%">200%</button>
            <button class="chip-btn" data-resize-preset="1920x1080">1080p</button>
            <button class="chip-btn" data-resize-preset="1280x720">720p</button>
          </div>
        </div>

        <div class="form-row">
          <span class="form-label">Quality:</span>
          <select id="resize-interpolation" class="input-num" style="width: 140px; text-align: left;">
            <option value="smooth">High Quality (Bicubic)</option>
            <option value="pixelated">Nearest Neighbor (Pixel Art)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-resize-cancel" class="btn-icon">Cancel</button>
        <button id="btn-resize-apply" class="btn-icon btn-accent">Apply Resize</button>
      </div>
    </div>
  </div>

  <!-- New Image Modal -->
  <div id="new-image-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title">New Image</div>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <span class="form-label">Width (px):</span>
          <input type="number" id="new-w-input" class="input-num" style="width: 100px;" value="1200" min="1">
        </div>
        <div class="form-row">
          <span class="form-label">Height (px):</span>
          <input type="number" id="new-h-input" class="input-num" style="width: 100px;" value="800" min="1">
        </div>
        <div class="form-row">
          <span class="form-label">Background:</span>
          <select id="new-bg-select" class="input-num" style="width: 140px; text-align: left;">
            <option value="white">White</option>
            <option value="transparent">Transparent</option>
            <option value="black">Black</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-new-cancel" class="btn-icon">Cancel</button>
        <button id="btn-new-create" class="btn-icon btn-accent">Create Image</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
