name: paint-electron
title: Paint
base: core24
adopt-info: metadata
license: MIT
grade: stable
confinement: strict
# Store and dock icon. Must be 40–512px (256 recommended) and <256KB.
# snap/gui/* is copied to meta/gui/; a 1024px assets/icon.png is rejected.
icon: snap/gui/paint-electron.png
summary: Fast, essential image editor
description: |
  Paint is a simple desktop image editor for crop, resize, rotate, blur,
  and converting PNG, JPEG, WebP, and GIF files.

  The Snap Store name is paint-electron because paint is already taken.
  The app still appears as Paint in the dock and application menu.

contact: https://github.com/longhorn09/paint-electron/issues
issues: https://github.com/longhorn09/paint-electron/issues
source-code: https://github.com/longhorn09/paint-electron
website: https://github.com/longhorn09/paint-electron

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

# No GNOME extension: core24 injects a clone of github.com/canonical/gpu-snap
# inside LXD, which often cannot reach GitHub. Electron already ships its UI.
apps:
  paint-electron:
    command: bin/paint-electron
    common-id: com.paint.electron
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - home
      - removable-media
      - browser-support
      - network
      - opengl
    environment:
      TMPDIR: $XDG_RUNTIME_DIR

parts:
  metadata:
    plugin: nil
    source: .
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)"
    prime:
      - -*

  paint-electron:
    plugin: dump
    source: release/linux-unpacked
    stage-packages:
      - libasound2t64
      - libnspr4
      - libnss3
      - libxss1
      - libsecret-1-0
      - libgtk-3-0
      - libnotify4
      - libgbm1
    override-build: |
      set -eu
      if [ ! -x "$CRAFT_PART_SRC/paint-electron" ]; then
        echo "Missing release/linux-unpacked. Run: npm run dist:snap" >&2
        exit 1
      fi
      craftctl default
      install -d "$CRAFT_PART_INSTALL/opt/Paint"
      for item in "$CRAFT_PART_INSTALL"/*; do
        name="$(basename "$item")"
        case "$name" in
          opt|usr|lib|etc|bin|var|meta) continue ;;
        esac
        mv "$item" "$CRAFT_PART_INSTALL/opt/Paint/"
      done
      rm -f "$CRAFT_PART_INSTALL/opt/Paint/chrome-sandbox"
      install -Dm755 "$CRAFT_PROJECT_DIR/snap/local/paint-electron.sh" "$CRAFT_PART_INSTALL/bin/paint-electron"
    prime:
      - -opt/Paint/chrome-sandbox
      - -opt/Paint/LICENSES.chromium.html
